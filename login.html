<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#b08d6a">
<title>Zent — Iniciar sesión</title>
<link rel="icon" href="icons/zent.svg" type="image/svg+xml">
<link rel="preload" href="fonts/inter-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/redaction10-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="sync.js"></script>
<script>
  var __zentTouchX = null;
  var __zentTouchY = null;
  document.addEventListener('gesturestart', function (event) { event.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function (event) { event.preventDefault(); }, { passive: false });
  document.addEventListener('gestureend', function (event) { event.preventDefault(); }, { passive: false });
  document.addEventListener('touchstart', function (event) {
    if (event.touches && event.touches.length === 1) {
      __zentTouchX = event.touches[0].clientX;
      __zentTouchY = event.touches[0].clientY;
    }
  }, { passive: true });
  document.addEventListener('touchmove', function (event) {
    if (!event.touches) return;
    if (event.touches.length > 1) { event.preventDefault(); return; }
    if (__zentTouchX === null) return;
    var dx = Math.abs(event.touches[0].clientX - __zentTouchX);
    var dy = Math.abs(event.touches[0].clientY - __zentTouchY);
    if (dx > dy && dx > 6) event.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', function () {
    __zentTouchX = null;
    __zentTouchY = null;
  }, { passive: true });
</script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: radial-gradient(900px 520px at 12% -6%, rgba(255, 252, 244, 0.92), transparent 62%), radial-gradient(760px 460px at 92% 4%, rgba(142, 182, 155, 0.3), transparent 60%), radial-gradient(700px 520px at 70% 100%, rgba(176, 141, 106, 0.22), transparent 62%), linear-gradient(168deg, #efe7da 0%, #e6dccd 48%, #ded2c1 100%); background-attachment: fixed; color: #1d2a25; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: pan-y; overflow-x: hidden; overflow-x: clip; overscroll-behavior-x: none; }
  .card { width: min(92vw, 400px); padding: 32px 24px; border-radius: 28px; background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(255, 255, 255, 0.74); box-shadow: 0 20px 50px rgba(122, 102, 72, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.65); backdrop-filter: blur(22px) saturate(115%); -webkit-backdrop-filter: blur(22px) saturate(115%); }
  h1 { margin: 0 0 8px; font-size: 26px; font-weight: 400; letter-spacing: -0.015em; font-family: "Redaction", Georgia, "Times New Roman", serif; }
  p { margin: 0 0 24px; color: #7b7568; font-size: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; text-decoration: none; color: inherit; }
  .mark { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #163b32, #0b2b26); color: #fff; font-weight: 900; font-size: 20px; display: grid; place-items: center; box-shadow: 0 10px 24px rgba(22, 59, 50, 0.28); }
  label { display: block; font-size: 12.5px; font-weight: 700; color: #7b7568; margin-bottom: 6px; margin-top: 16px; }
  input { width: 100%; padding: 12px 14px; border: 1px solid rgba(255, 255, 255, 0.72); border-radius: 14px; background: rgba(255, 255, 255, 0.55); font-size: 16px; margin-bottom: 8px; outline: none; -webkit-user-select: text; user-select: text; }
  input:focus { border-color: #b08d6a; box-shadow: 0 0 0 3px rgba(176, 141, 106, 0.16); }
  .btn { width: 100%; padding: 12px; border: 0; border-radius: 999px; background: #b08d6a; color: #fff; font-size: 15px; font-weight: 650; cursor: pointer; margin-top: 20px; box-shadow: 0 10px 24px rgba(176, 141, 106, 0.32); }
  .btn:hover { filter: brightness(1.05); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 11px; border: 1px solid rgba(255, 255, 255, 0.72); border-radius: 14px; background: rgba(255, 255, 255, 0.55); color: #1d2a25; font-size: 14.5px; font-weight: 700; cursor: pointer; }
  .google-btn:hover { background: rgba(255, 255, 255, 0.78); }
  .google-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .google-btn svg { width: 18px; height: 18px; flex: none; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; font-size: 12px; color: #8d8676; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(122, 110, 88, 0.18); }
  .link { background: none; border: 0; color: #b08d6a; font-size: 13.5px; font-weight: 700; cursor: pointer; text-align: center; width: 100%; padding: 10px; }
  .link:hover { text-decoration: underline; }
  .error { margin-top: 12px; color: #a65d4a; font-size: 13px; font-weight: 600; display: none; line-height: 1.45; }
  .error.ok { color: #4f7f63; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 12px 18px; border-radius: 999px; background: #163b32; color: #daf1de; font-size: 13.5px; font-weight: 650; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center; }
  .toast.on { opacity: 1; }
  .hint { font-size: 12px; color: #8d8676; margin-top: 10px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <a class="brand" href="index.html">
    <span class="mark" aria-hidden="true">Z</span>
    <span style="font-size: 21px; font-family: 'Redaction', Georgia, 'Times New Roman', serif; letter-spacing: -0.01em;">Zent</span>
  </a>
  <h1>Zent</h1>
  <p>Inicia sesión para sincronizar tus finanzas en todos tus dispositivos.</p>

  <button class="google-btn" id="btnGoogle" type="button">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    <span>Continuar con Google</span>
  </button>

  <div class="divider">o con tu correo</div>

  <div id="mode-login">
    <label for="loginEmail">Correo electrónico</label>
    <input id="loginEmail" type="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" inputmode="email">
    <label for="loginPassword">Contraseña</label>
    <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="btnLogin" data-label="Iniciar sesión" type="button">Iniciar sesión</button>
    <button class="link" id="resendLink" type="button" style="display:none">Reenviar correo de confirmación</button>
  </div>

  <div class="divider">o</div>

  <div id="mode-signup" style="display:none">
    <label for="signupEmail">Correo electrónico</label>
    <input id="signupEmail" type="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" inputmode="email">
    <label for="signupPassword">Contraseña</label>
    <input id="signupPassword" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
    <button class="btn" id="btnSignup" data-label="Crear cuenta" type="button">Crear cuenta</button>
    <p class="hint">Te enviaremos un correo para confirmar la cuenta.</p>
  </div>

  <button class="link" id="toggleMode" type="button">¿No tienes cuenta? Regístrate</button>
  <button class="link" id="toggleLogin" type="button" style="display:none">¿Ya tienes cuenta? Inicia sesión</button>

  <div id="error" class="error" role="alert" aria-live="assertive"></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  const btnLogin = document.getElementById('btnLogin');
  const btnSignup = document.getElementById('btnSignup');
  const toggleMode = document.getElementById('toggleMode');
  const toggleLogin = document.getElementById('toggleLogin');
  const modeLogin = document.getElementById('mode-login');
  const modeSignup = document.getElementById('mode-signup');
  const errorBox = document.getElementById('error');
  const toastEl = document.getElementById('toast');
  const resendLink = document.getElementById('resendLink');
  const btnGoogle = document.getElementById('btnGoogle');

  function redirectTo() {
    return new URL('login.html', location.href).href;
  }

  function showResend(show) {
    resendLink.style.display = show ? 'block' : 'none';
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    setTimeout(() => toastEl.classList.remove('on'), 2600);
  }

  function showError(msg, ok) {
    errorBox.textContent = msg;
    errorBox.style.display = msg ? 'block' : 'none';
    errorBox.classList.toggle('ok', Boolean(ok));
  }

  function setLoading(el, loading) {
    el.disabled = loading;
    el.textContent = loading ? 'Procesando…' : el.dataset.label;
  }

  function translateError(err) {
    const msg = (err && err.message ? err.message : String(err || '')).toLowerCase();

    if (msg.includes('invalid login credentials')) return 'Correo o contraseña incorrectos.';
    if (msg.includes('email not confirmed')) return 'Debes confirmar tu correo antes de iniciar sesión. Revisa tu bandeja de entrada (y spam).';
    if (msg.includes('user already registered')) return 'Ya existe una cuenta con ese correo. Inicia sesión.';
    if (msg.includes('password should be at least')) return 'La contraseña debe tener al menos 6 caracteres.';
    if (msg.includes('unable to validate email') || msg.includes('invalid email')) return 'El correo no es válido.';
    if (msg.includes('rate limit') || msg.includes('too many requests')) return 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.';
    if (msg.includes('signups not allowed')) return 'El registro está deshabilitado en Supabase.';
    if (msg.includes('provider is not enabled') || msg.includes('unsupported provider')) return 'El inicio de sesión con Google no está habilitado en Supabase.';
    if (msg.includes('access_denied') || msg.includes('canceled') || msg.includes('cancelled')) return 'Cancelaste el inicio de sesión con Google.';
    if (msg.includes('failed to fetch') || msg.includes('networkerror')) return 'No hay conexión con el servidor. Revisa tu internet e inténtalo de nuevo.';
    if (msg.includes('email address') && msg.includes('invalid')) return 'El correo no es válido.';
    return (err && err.message) ? err.message : 'Ocurrió un error inesperado.';
  }

  function client() {
    if (typeof supabaseClient === 'undefined' || !supabaseClient) {
      showError('No se pudo conectar con Supabase. Revisa tu conexión y recarga la página.');
      return null;
    }
    return supabaseClient;
  }

  btnGoogle.addEventListener('click', async () => {
    const sb = client();
    if (!sb) return;

    showError('');
    showResend(false);
    btnGoogle.disabled = true;
    try {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: redirectTo() }
      });
      if (error) {
        showError(translateError(error));
        btnGoogle.disabled = false;
      }
    } catch (err) {
      showError(translateError(err));
      btnGoogle.disabled = false;
    }
  });

  toggleMode.addEventListener('click', () => {
    modeLogin.style.display = 'none';
    modeSignup.style.display = 'block';
    toggleMode.style.display = 'none';
    toggleLogin.style.display = 'block';
    showResend(false);
    showError('');
  });

  toggleLogin.addEventListener('click', () => {
    modeSignup.style.display = 'none';
    modeLogin.style.display = 'block';
    toggleMode.style.display = 'block';
    toggleLogin.style.display = 'none';
    showError('');
  });

  async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { showError('Completa correo y contraseña.'); return; }

    const sb = client();
    if (!sb) return;

    showError('');
    showResend(false);
    setLoading(btnLogin, true);
    try {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        const message = translateError(error);
        showError(message);
        showResend(/confirmar tu correo/i.test(message));
        return;
      }
      showToast('Sesión iniciada.');
      setTimeout(() => { location.href = 'index.html'; }, 500);
    } catch (err) {
      showError(translateError(err));
    } finally {
      setLoading(btnLogin, false);
    }
  }

  async function handleSignup() {
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    if (!email || !password) { showError('Completa correo y contraseña.'); return; }
    if (password.length < 6) { showError('La contraseña debe tener al menos 6 caracteres.'); return; }

    const sb = client();
    if (!sb) return;

    showError('');
    setLoading(btnSignup, true);
    try {
      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: { emailRedirectTo: redirectTo() }
      });
      if (error) { showError(translateError(error)); return; }

      if (data && data.session) {
        showToast('Cuenta creada. Entrando…');
        setTimeout(() => { location.href = 'index.html'; }, 700);
        return;
      }

      showError('Cuenta creada. Revisa tu correo (' + email + ') y haz clic en el enlace de confirmación. Después inicia sesión aquí.', true);
      document.getElementById('signupPassword').value = '';
    } catch (err) {
      showError(translateError(err));
    } finally {
      setLoading(btnSignup, false);
    }
  }

  btnLogin.addEventListener('click', handleLogin);
  btnSignup.addEventListener('click', handleSignup);

  document.getElementById('loginPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleLogin();
  });
  document.getElementById('signupPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSignup();
  });

  resendLink.addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    if (!email) {
      showError('Escribe tu correo en el campo de arriba para reenviar la confirmación.');
      return;
    }
    const sb = client();
    if (!sb) return;

    showError('');
    resendLink.disabled = true;
    try {
      const { error } = await sb.auth.resend({
        type: 'signup',
        email,
        options: { emailRedirectTo: redirectTo() }
      });
      if (error) { showError(translateError(error)); return; }
      showToast('Correo reenviado. Revisa tu bandeja y spam.');
    } catch (err) {
      showError(translateError(err));
    } finally {
      resendLink.disabled = false;
    }
  });

  // Si ya hay una sesión activa, ir directo a la app.
  (async () => {
    // Errores que Supabase devuelve al volver del enlace de confirmación.
    if (location.hash) {
      const params = new URLSearchParams(location.hash.replace(/^#/, ''));
      const message = params.get('error_description') || params.get('error');
      if (message) {
        showError(decodeURIComponent(message.replace(/\+/g, ' ')));
        history.replaceState(null, '', location.pathname + location.search);
      }
    }

    if (typeof supabaseClient === 'undefined' || !supabaseClient) {
      showError('No se pudo cargar Supabase. Revisa tu conexión, desactiva bloqueadores y recarga la página.');
      return;
    }
    try {
      const { data } = await supabaseClient.auth.getSession();
      if (data && data.session) location.replace('index.html');
    } catch (err) {
      console.warn('Zent: no se pudo comprobar la sesión.', err);
    }
  })();
})();
</script>
</body>
</html>
