<head>

<title>Zent — Iniciar sesión</title>

<link rel="preload" href="fonts/inter-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/redaction10-regular.woff2" as="font" type="font/woff2" crossorigin>

<script>
  var __zentTouchX = null;
  var __zentTouchY = null;
  document.addEventListener('gesturestart', function (event) { event.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function (event) { event.preventDefault(); }, { passive: false });
  document.addEventListener('gestureend', function (event) { event.preventDefault(); }, { passive: false });
  document.addEventListener('touchstart', function (event) {
    if (event.touches && event.touches.length === 1) {
      __zentTouchX = event.touches[0].clientX;
      __zentTouchY = event.touches[0].clientY;
    }
  }, { passive: true });
  document.addEventListener('touchmove', function (event) {
    if (!event.touches) return;
    if (event.touches.length > 1) { event.preventDefault(); return; }
    if (__zentTouchX === null) return;
    var dx = Math.abs(event.touches[0].clientX - __zentTouchX);
    var dy = Math.abs(event.touches[0].clientY - __zentTouchY);
    if (dx > dy && dx > 6) event.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', function () {
    __zentTouchX = null;
    __zentTouchY = null;
  }, { passive: true });
</script>
<style>
  * { box-sizing: border-box; }
  :root {
    --forest: #163b32;
    --forest-2: #0b2b26;
    --sage: #8eb69b;
    --camel: #b08d6a;
    --cream: #f6f0e6;
    --ink: #1d2a25;
    --muted: #7b7568;
    --line: rgba(122, 110, 88, .2);
    --serif: "Redaction", Georgia, "Times New Roman", serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    min-height: 100dvh;
    font-family: var(--sans);
    background: var(--cream);
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: pan-y;
    overflow-x: hidden;
    overflow-x: clip;
    overscroll-behavior-x: none;
  }
  a { color: inherit; }
  .shell {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Cabecera bosque ---------- */
  .bosque-top {
    position: relative;
    flex: none;
    min-height: 340px;
    overflow: hidden;
    padding-top: max(0px, env(safe-area-inset-top));
    color: #f5f0e6;
    background:
      radial-gradient(340px 260px at 18% 8%, rgba(142, 182, 155, .26), transparent 64%),
      radial-gradient(360px 300px at 96% 88%, rgba(176, 141, 106, .2), transparent 66%),
      linear-gradient(150deg, #214c40, #0c2c26 58%, #071d19);
  }
  .rosette {
    position: absolute;
    top: -46px;
    right: -70px;
    width: 340px;
    height: 340px;
    opacity: .28;
    pointer-events: none;
  }
  .rosette ellipse, .rosette circle {
    fill: none;
    stroke: #daf1de;
    stroke-width: 1;
  }
  .brand {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 11px;
    width: fit-content;
    margin: 18px 24px 0;
    text-decoration: none;
  }
  .seal {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border: 1.5px solid rgba(176, 141, 106, .9);
    border-radius: 50%;
    background: #f7f1e7;
    color: var(--forest);
    font-family: var(--serif);
    font-size: 27px;
    line-height: 1;
    box-shadow: 0 9px 20px rgba(3, 17, 14, .32), inset 0 0 0 3px rgba(142, 182, 155, .18);
  }
  .wordmark {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -.01em;
  }
  .bosque-copy {
    position: relative;
    z-index: 2;
    padding: 44px 26px 0;
  }
  .eyebrow {
    margin: 0 0 9px;
    color: #c3a17f;
    font-size: 9.5px;
    font-weight: 750;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .bosque-copy h1 {
    max-width: 310px;
    margin: 0;
    font-family: var(--serif);
    font-size: 36px;
    font-weight: 400;
    letter-spacing: -.028em;
    line-height: 1.02;
  }
  .top-sub {
    margin: 9px 0 0;
    color: rgba(218, 241, 222, .72);
    font-size: 11.5px;
    line-height: 1.5;
  }

  /* ---------- Hoja del formulario ---------- */
  .bosque-sheet {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 24px calc(24px + env(safe-area-inset-bottom));
    border-radius: 34px 34px 0 0;
    background:
      radial-gradient(420px 260px at 100% 0%, rgba(255, 255, 255, .62), transparent 60%),
      var(--cream);
    box-shadow: 0 -16px 34px rgba(5, 25, 20, .16);
  }
  .auth-tabs {
    display: flex;
    gap: 4px;
    padding: 4px;
    border: 1px solid rgba(122, 110, 88, .16);
    border-radius: 999px;
    background: #e9dfd1;
  }
  .auth-tab {
    flex: 1;
    padding: 8px 0;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: #8a8274;
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: background .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .auth-tab.active {
    background: #fffaf2;
    color: var(--forest);
    box-shadow: 0 4px 10px rgba(122, 102, 72, .12);
  }
  .auth-tab:focus-visible {
    outline: 2px solid var(--camel);
    outline-offset: 2px;
  }
  .google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 100%;
    height: 46px;
    margin-top: 16px;
    border: 1px solid rgba(122, 110, 88, .18);
    border-radius: 14px;
    background: rgba(255, 255, 255, .62);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(122, 102, 72, .06);
    transition: background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .google:hover { background: rgba(255, 255, 255, .82); }
  .google:active { transform: scale(.985); }
  .google:disabled { opacity: .6; cursor: not-allowed; }
  .google svg { width: 17px; height: 17px; flex: none; }
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 15px 0;
    color: #8a8274;
    font-size: 10.5px;
    white-space: nowrap;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .field { display: flex; flex-direction: column; gap: 6px; margin-top: 11px; }
  .field label {
    color: var(--muted);
    font-size: 9.5px;
    font-weight: 750;
    letter-spacing: .11em;
    text-transform: uppercase;
  }
  .input-shell {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 46px;
    padding: 0 13px;
    border: 1px solid rgba(122, 110, 88, .16);
    border-radius: 14px;
    background: rgba(255, 255, 255, .68);
    color: var(--muted);
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .input-shell:focus-within {
    border-color: var(--camel);
    background: rgba(255, 255, 255, .86);
    box-shadow: 0 0 0 3px rgba(176, 141, 106, .14);
  }
  .input-shell > svg {
    flex: none;
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .input-shell input {
    flex: 1;
    min-width: 0;
    padding: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13.5px;
    -webkit-user-select: text;
    user-select: text;
  }
  .input-shell input::placeholder { color: #9a9385; }
  .eye {
    flex: none;
    display: grid;
    place-items: center;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #928b7d;
    cursor: pointer;
    transition: color .15s ease, background .15s ease;
  }
  .eye:hover { background: rgba(176, 141, 106, .12); color: var(--camel); }
  .eye.on { color: var(--camel); }
  .eye svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .primary {
    width: 100%;
    height: 48px;
    margin-top: 17px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(135deg, #235348, var(--forest-2));
    color: #f5f0e6;
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 14px 26px rgba(11, 43, 38, .28);
    transition: filter .15s ease, transform .12s ease;
  }
  .primary:hover { filter: brightness(1.07); }
  .primary:active { transform: scale(.985); }
  .primary:disabled { opacity: .6; cursor: not-allowed; }
  .link {
    display: block;
    width: 100%;
    padding: 10px 0 0;
    border: 0;
    background: none;
    color: var(--camel);
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
  }
  .link:hover { text-decoration: underline; }
  .hint {
    margin: 8px 0 0;
    color: #8d8676;
    font-size: 10.5px;
    line-height: 1.5;
    text-align: center;
  }
  .error {
    display: none;
    margin-top: 14px;
    padding: 10px 12px;
    border: 1px solid rgba(166, 93, 74, .18);
    border-radius: 12px;
    background: rgba(166, 93, 74, .09);
    color: #a65d4a;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.45;
  }
  .error.ok {
    border-color: rgba(79, 127, 99, .18);
    background: rgba(79, 127, 99, .1);
    color: #4f7f63;
  }
  .secure {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: auto 0 0;
    padding-top: 12px;
    color: #979081;
    font-size: 10px;
    text-align: center;
  }
  .secure svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    z-index: 20;
    max-width: min(90vw, 420px);
    padding: 12px 18px;
    border-radius: 999px;
    background: var(--forest);
    color: #daf1de;
    font-size: 13px;
    font-weight: 650;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 8px);
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Pantallas cortas ---------- */
  @media (max-height: 700px) and (max-width: 899px) {
    .bosque-top { min-height: 280px; }
    .bosque-copy { padding-top: 30px; }
    .bosque-copy h1 { font-size: 31px; }
    .bosque-sheet { padding-top: 16px; }
  }

  @media (min-width: 600px) and (max-width: 899px) {
    .bosque-sheet { align-items: center; }
    .bosque-sheet > * { width: 100%; max-width: 460px; }
    .bosque-sheet .secure { margin-top: auto; }
  }

  /* ---------- Escritorio ---------- */
  @media (min-width: 900px) {
    body {
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(900px 600px at 12% 0%, rgba(255, 252, 244, .85), transparent 62%),
        radial-gradient(900px 700px at 100% 100%, rgba(142, 182, 155, .24), transparent 62%),
        linear-gradient(168deg, #efe7da 0%, #e6dccd 48%, #ded2c1 100%);
    }
    .shell {
      width: min(1040px, 100%);
      min-height: 680px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border-radius: 36px;
      box-shadow: 0 40px 80px rgba(66, 50, 30, .22), 0 4px 14px rgba(66, 50, 30, .1);
    }
    .bosque-top {
      min-height: 100%;
      padding-top: 0;
      display: flex;
      flex-direction: column;
    }
    .brand { margin: 38px 42px 0; }
    .bosque-copy { margin-top: auto; margin-bottom: auto; padding: 0 44px; }
    .bosque-copy h1 { font-size: 48px; max-width: 370px; }
    .top-sub { font-size: 13px; }
    .rosette { top: -30px; right: -90px; width: 430px; height: 430px; }
    .bosque-sheet {
      justify-content: center;
      padding: 46px 46px calc(30px + env(safe-area-inset-bottom));
      border-radius: 0;
      box-shadow: none;
    }
    .bosque-sheet .secure { margin-top: 20px; }
    .toast { bottom: 24px; }
  }
</style>
</head>

      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>

  </defs>

<main class="shell">
  <section class="bosque-top">
    <svg class="rosette" viewBox="0 0 340 340" aria-hidden="true">
      <g transform="translate(170 170)">
        <ellipse rx="160" ry="58"/><ellipse rx="160" ry="58" transform="rotate(30)"/>
        <ellipse rx="160" ry="58" transform="rotate(60)"/><ellipse rx="160" ry="58" transform="rotate(90)"/>
        <ellipse rx="160" ry="58" transform="rotate(120)"/><ellipse rx="160" ry="58" transform="rotate(150)"/>
        <circle r="118"/><circle r="150" stroke-dasharray="1 6"/>
      </g>
    </svg>

    <a class="brand" href="index.html" aria-label="Zent">
      <span class="seal" aria-hidden="true">Z</span>
      <span class="wordmark">Zent</span>
    </a>

    <div class="bosque-copy">
      <p class="eyebrow" id="authEyebrow">Bienvenido de nuevo</p>
      <h1 id="authTitle">Tus finanzas,<br>con calma.</h1>
      <p class="top-sub" id="authSubtitle">Entra y sigue donde dejaste.</p>
    </div>
  </section>

  <section class="bosque-sheet">
    <div class="auth-tabs" role="tablist" aria-label="Acceso a Zent">
      <button class="auth-tab active" id="tabLogin" type="button" role="tab" aria-selected="true" aria-controls="mode-login">Entrar</button>
      <button class="auth-tab" id="tabSignup" type="button" role="tab" aria-selected="false" aria-controls="mode-signup">Crear cuenta</button>
    </div>

    <button class="google" id="btnGoogle" type="button">
      <svg><use href="#g-google"/></svg>
      <span>Continuar con Google</span>
    </button>

    <div class="divider">o con tu correo</div>

    <div id="mode-login" role="tabpanel" aria-labelledby="tabLogin">
      <div class="field">
        <label for="loginEmail">Correo electrónico</label>
        <div class="input-shell">
          <svg><use href="#g-mail"/></svg>
          <input id="loginEmail" type="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" inputmode="email">
        </div>
      </div>
      <div class="field">
        <label for="loginPassword">Contraseña</label>
        <div class="input-shell">
          <svg><use href="#g-lock"/></svg>
          <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">
          <button class="eye" type="button" data-eye="loginPassword" aria-label="Mostrar contraseña">
            <svg><use href="#g-eye"/></svg>
          </button>
        </div>
      </div>
      <button class="primary" id="btnLogin" data-label="Entrar" type="button">Entrar</button>
      <button class="link" id="resendLink" type="button" style="display:none">Reenviar correo de confirmación</button>
    </div>

    <div id="mode-signup" role="tabpanel" aria-labelledby="tabSignup" style="display:none">
      <div class="field">
        <label for="signupEmail">Correo electrónico</label>
        <div class="input-shell">
          <svg><use href="#g-mail"/></svg>
          <input id="signupEmail" type="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" inputmode="email">
        </div>
      </div>
      <div class="field">
        <label for="signupPassword">Contraseña</label>
        <div class="input-shell">
          <svg><use href="#g-lock"/></svg>
          <input id="signupPassword" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
          <button class="eye" type="button" data-eye="signupPassword" aria-label="Mostrar contraseña">
            <svg><use href="#g-eye"/></svg>
          </button>
        </div>
      </div>
      <button class="primary" id="btnSignup" data-label="Crear cuenta" type="button">Crear cuenta</button>
      <p class="hint">Te enviaremos un correo para confirmar la cuenta.</p>
    </div>

    <div id="error" class="error" role="alert" aria-live="assertive"></div>

    <p class="secure">
      <svg><use href="#g-lock"/></svg>
      Tus datos están seguros en este dispositivo
    </p>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

     sesión aparezca de inmediato. -->
<script src="vendor/supabase-js.js"></script>

<script>
(function () {
  'use strict';

  const btnLogin = document.getElementById('btnLogin');
  const btnSignup = document.getElementById('btnSignup');
  const tabLogin = document.getElementById('tabLogin');
  const tabSignup = document.getElementById('tabSignup');
  const modeLogin = document.getElementById('mode-login');
  const modeSignup = document.getElementById('mode-signup');
  const authEyebrow = document.getElementById('authEyebrow');
  const authTitle = document.getElementById('authTitle');
  const authSubtitle = document.getElementById('authSubtitle');
  const errorBox = document.getElementById('error');
  const toastEl = document.getElementById('toast');
  const resendLink = document.getElementById('resendLink');
  const btnGoogle = document.getElementById('btnGoogle');

  function redirectTo() {
    return new URL('login.html', location.href).href;
  }

  function showResend(show) {
    resendLink.style.display = show ? 'block' : 'none';
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    setTimeout(() => toastEl.classList.remove('on'), 2600);
  }

  function showError(msg, ok) {
    errorBox.textContent = msg;
    errorBox.style.display = msg ? 'block' : 'none';
    errorBox.classList.toggle('ok', Boolean(ok));
  }

  function setMode(mode) {
    const signup = mode === 'signup';
    modeLogin.style.display = signup ? 'none' : 'block';
    modeSignup.style.display = signup ? 'block' : 'none';
    tabLogin.classList.toggle('active', !signup);
    tabSignup.classList.toggle('active', signup);
    tabLogin.setAttribute('aria-selected', signup ? 'false' : 'true');
    tabSignup.setAttribute('aria-selected', signup ? 'true' : 'false');
    authEyebrow.textContent = signup ? 'Tu primer paso' : 'Bienvenido de nuevo';
    authTitle.innerHTML = signup ? 'Empieza con<br>calma.' : 'Tus finanzas,<br>con calma.';
    authSubtitle.textContent = signup ? 'Crea tu cuenta y ordena tu dinero.' : 'Entra y sigue donde dejaste.';
    showResend(false);
    showError('');
  }

  tabLogin.addEventListener('click', () => setMode('login'));
  tabSignup.addEventListener('click', () => setMode('signup'));

  document.querySelectorAll('[data-eye]').forEach((button) => {
    button.addEventListener('click', () => {
      const input = document.getElementById(button.dataset.eye);
      if (!input) return;
      const visible = input.type === 'password';
      input.type = visible ? 'text' : 'password';
      button.classList.toggle('on', visible);
      button.setAttribute('aria-label', visible ? 'Ocultar contraseña' : 'Mostrar contraseña');
      const use = button.querySelector('use');
      if (use) {
        const icon = visible ? '#g-eye-off' : '#g-eye';
        use.setAttribute('href', icon);
        use.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', icon);
      }
    });
  });

  // La página de acceso también registra el service worker: así queda
  // disponible sin conexión y las próximas aperturas son instantáneas.
  if ('serviceWorker' in navigator) {
    const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (location.protocol === 'https:' || isLocal) {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .then((registration) => registration.update().catch(() => {}))
        .catch((error) => console.warn('Zent: no se pudo registrar el service worker.', error));
    }
  }

  function setLoading(el, loading) {
    el.disabled = loading;
    el.textContent = loading ? 'Procesando…' : el.dataset.label;
  }

  function translateError(err) {
    const msg = (err && err.message ? err.message : String(err || '')).toLowerCase();

    if (msg.includes('invalid login credentials')) return 'Correo o contraseña incorrectos.';
    if (msg.includes('email not confirmed')) return 'Debes confirmar tu correo antes de iniciar sesión. Revisa tu bandeja de entrada (y spam).';
    if (msg.includes('user already registered')) return 'Ya existe una cuenta con ese correo. Inicia sesión.';
    if (msg.includes('password should be at least')) return 'La contraseña debe tener al menos 6 caracteres.';
    if (msg.includes('unable to validate email') || msg.includes('invalid email')) return 'El correo no es válido.';
    if (msg.includes('rate limit') || msg.includes('too many requests')) return 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.';
    if (msg.includes('signups not allowed')) return 'El registro está deshabilitado en Supabase.';
    if (msg.includes('provider is not enabled') || msg.includes('unsupported provider')) return 'El inicio de sesión con Google no está habilitado en Supabase.';
    if (msg.includes('access_denied') || msg.includes('canceled') || msg.includes('cancelled')) return 'Cancelaste el inicio de sesión con Google.';
    if (msg.includes('failed to fetch') || msg.includes('networkerror')) return 'No hay conexión con el servidor. Revisa tu internet e inténtalo de nuevo.';
    if (msg.includes('email address') && msg.includes('invalid')) return 'El correo no es válido.';
    return (err && err.message) ? err.message : 'Ocurrió un error inesperado.';
  }

  function client() {
    if (typeof supabaseClient === 'undefined' || !supabaseClient) {
      showError('No se pudo conectar con Supabase. Revisa tu conexión y recarga la página.');
      return null;
    }
    return supabaseClient;
  }

  btnGoogle.addEventListener('click', async () => {
    const sb = client();
    if (!sb) return;

    showError('');
    showResend(false);
    btnGoogle.disabled = true;
    try {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: redirectTo() }
      });
      if (error) {
        showError(translateError(error));
        btnGoogle.disabled = false;
      }
    } catch (err) {
      showError(translateError(err));
      btnGoogle.disabled = false;
    }
  });

  async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { showError('Completa correo y contraseña.'); return; }

    const sb = client();
    if (!sb) return;

    showError('');
    showResend(false);
    setLoading(btnLogin, true);
    try {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        const message = translateError(error);
        showError(message);
        showResend(/confirmar tu correo/i.test(message));
        return;
      }
      showToast('Sesión iniciada.');
      setTimeout(() => { location.href = 'index.html'; }, 500);
    } catch (err) {
      showError(translateError(err));
    } finally {
      setLoading(btnLogin, false);
    }
  }

  async function handleSignup() {
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    if (!email || !password) { showError('Completa correo y contraseña.'); return; }
    if (password.length < 6) { showError('La contraseña debe tener al menos 6 caracteres.'); return; }

    const sb = client();
    if (!sb) return;

    showError('');
    setLoading(btnSignup, true);
    try {
      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: { emailRedirectTo: redirectTo() }
      });
      if (error) { showError(translateError(error)); return; }

      if (data && data.session) {
        showToast('Cuenta creada. Entrando…');
        setTimeout(() => { location.href = 'index.html'; }, 700);
        return;
      }

      showError('Cuenta creada. Revisa tu correo (' + email + ') y haz clic en el enlace de confirmación. Después inicia sesión aquí.', true);
      document.getElementById('signupPassword').value = '';
    } catch (err) {
      showError(translateError(err));
    } finally {
      setLoading(btnSignup, false);
    }
  }

  btnLogin.addEventListener('click', handleLogin);
  btnSignup.addEventListener('click', handleSignup);

  document.getElementById('loginPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleLogin();
  });
  document.getElementById('signupPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSignup();
  });

  resendLink.addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    if (!email) {
      showError('Escribe tu correo en el campo de arriba para reenviar la confirmación.');
      return;
    }
    const sb = client();
    if (!sb) return;

    showError('');
    resendLink.disabled = true;
    try {
      const { error } = await sb.auth.resend({
        type: 'signup',
        email,
        options: { emailRedirectTo: redirectTo() }
      });
      if (error) { showError(translateError(error)); return; }
      showToast('Correo reenviado. Revisa tu bandeja y spam.');
    } catch (err) {
      showError(translateError(err));
    } finally {
      resendLink.disabled = false;
    }
  });

  // Si ya hay una sesión activa, ir directo a la app.
  (async () => {
    // Errores que Supabase devuelve al volver del enlace de confirmación.
    if (location.hash) {
      const params = new URLSearchParams(location.hash.replace(/^#/, ''));
      const message = params.get('error_description') || params.get('error');
      if (message) {
        showError(decodeURIComponent(message.replace(/\+/g, ' ')));
        history.replaceState(null, '', location.pathname + location.search);
      }
    }

    if (typeof supabaseClient === 'undefined' || !supabaseClient) {
      showError('No se pudo cargar Supabase. Revisa tu conexión, desactiva bloqueadores y recarga la página.');
      return;
    }
    try {
      const { data } = await supabaseClient.auth.getSession();
      if (data && data.session) location.replace('index.html');
    } catch (err) {
      console.warn('Zent: no se pudo comprobar la sesión.', err);
    }
  })();
})();
</script>
</body>
</html>
