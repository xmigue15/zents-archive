<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b5bd6">
<title>Zent — Iniciar sesión</title>
<link rel="icon" href="icons/zent.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: radial-gradient(1200px 600px at 15% -10%, rgba(91, 91, 214, 0.12), transparent 60%), radial-gradient(900px 500px at 100% 0%, rgba(139, 92, 246, 0.09), transparent 55%), #f5f6fb; color: #141a2e; min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
  .card { width: min(92vw, 400px); padding: 32px 24px; border-radius: 24px; background: #fff; border: 1px solid #e4e7f0; box-shadow: 0 20px 50px rgba(20, 26, 46, 0.1); }
  h1 { margin: 0 0 8px; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
  p { margin: 0 0 24px; color: #6b7280; font-size: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; text-decoration: none; color: inherit; }
  .mark { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #5b5bd6, #8b5cf6); color: #fff; font-weight: 900; font-size: 20px; display: grid; place-items: center; }
  label { display: block; font-size: 12.5px; font-weight: 700; color: #6b7280; margin-bottom: 6px; margin-top: 16px; }
  input { width: 100%; padding: 12px 14px; border: 1px solid #e4e7f0; border-radius: 12px; background: #f7f8fd; font-size: 15px; margin-bottom: 8px; outline: none; }
  input:focus { border-color: #5b5bd6; box-shadow: 0 0 0 3px rgba(91, 91, 214, 0.12); }
  .btn { width: 100%; padding: 12px; border: 0; border-radius: 12px; background: linear-gradient(135deg, #5b5bd6, #8b5cf6); color: #fff; font-size: 15px; font-weight: 750; cursor: pointer; margin-top: 20px; }
  .btn:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; font-size: 12px; color: #9aa4ba; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e4e7f0; }
  .link { background: none; border: 0; color: #5b5bd6; font-size: 13.5px; font-weight: 700; cursor: pointer; text-align: center; width: 100%; padding: 10px; }
  .link:hover { text-decoration: underline; }
  .error { margin-top: 12px; color: #e11d48; font-size: 13px; font-weight: 600; display: none; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 12px 18px; border-radius: 999px; background: #141a2e; color: #fff; font-size: 13.5px; font-weight: 650; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="card">
  <a class="brand" href="index.html">
    <span class="mark" aria-hidden="true">Z</span>
    <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.03em;">Zent</span>
  </a>
  <h1>Zent</h1>
  <p>Inicia sesión para sincronizar tus finanzas en todos tus dispositivos.</p>

  <div id="mode-login" style="display:block">
    <label for="loginEmail">Correo electrónico</label>
    <input id="loginEmail" type="email" placeholder="tucorreo@ejemplo.com" autocomplete="email">
    <label for="loginPassword">Contraseña</label>
    <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="btnLogin" data-label="Iniciar sesión">Iniciar sesión</button>
  </div>

  <div class="divider">o</div>

  <div id="mode-signup" style="display:none">
    <label for="signupEmail">Correo electrónico</label>
    <input id="signupEmail" type="email" placeholder="tucorreo@ejemplo.com" autocomplete="email">
    <label for="signupPassword">Contraseña</label>
    <input id="signupPassword" type="password" placeholder="••••••••" autocomplete="new-password">
    <button class="btn" id="btnSignup" data-label="Crear cuenta">Crear cuenta</button>
  </div>

  <button class="link" id="toggleMode">¿No tienes cuenta? Regístrate</button>
  <button class="link" id="toggleLogin">¿Ya tienes cuenta? Inicia sesión</button>

  <div id="error" class="error"></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function() {
  const btnLogin = document.getElementById('btnLogin');
  const btnSignup = document.getElementById('btnSignup');
  const toggleMode = document.getElementById('toggleMode');
  const toggleLogin = document.getElementById('toggleLogin');
  const modeLogin = document.getElementById('mode-login');
  const modeSignup = document.getElementById('mode-signup');
  const error = document.getElementById('error');
  const toast = document.getElementById('toast');

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('on');
    setTimeout(() => toast.classList.remove('on'), 2400);
  }

  function showError(msg) {
    error.textContent = msg;
    error.style.display = 'block';
  }

  function setLoading(el, loading) {
    el.disabled = loading;
    el.textContent = loading ? 'Procesando…' : el.dataset.label;
  }

  toggleMode.addEventListener('click', () => {
    modeLogin.style.display = 'none';
    modeSignup.style.display = 'block';
    error.style.display = 'none';
  });
  toggleLogin.addEventListener('click', () => {
    modeSignup.style.display = 'none';
    modeLogin.style.display = 'block';
    error.style.display = 'none';
  });

  btnLogin.addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { showError('Completa correo y contraseña.'); return; }
    showError('');
    setLoading(btnLogin, true);
    const { data, error: err } = await supabaseClient.auth.signInWithPassword({ email, password });
    setLoading(btnLogin, false);
    if (err) { showError(err.message); return; }
    showToast('Sesión iniciada.');
    setTimeout(() => { location.href = 'index.html'; }, 600);
  });

  btnSignup.addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    if (!email || !password) { showError('Completa correo y contraseña.'); return; }
    showError('');
    setLoading(btnSignup, true);
    const { data, error: err } = await supabaseClient.auth.signUp({ email, password });
    setLoading(btnSignup, false);
    if (err) { showError(err.message); return; }
    showToast('Cuenta creada. Inicia sesión.');
    setTimeout(() => { modeSignup.style.display = 'none'; modeLogin.style.display = 'block'; error.style.display = 'none'; }, 600);
  });
})();
</script>
</body>
</html>
