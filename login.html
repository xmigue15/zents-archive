<html lang="es">
<head>
<meta charset="utf-8">

<title>Zent — Iniciar sesión</title>

<link rel="preload" href="fonts/inter-normal.woff2" as="font" type="font/woff2" crossorigin>

<script>
  var __zentTouchX = null;
  var __zentTouchY = null;
  document.addEventListener('gesturestart', function (event) { event.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function (event) { event.preventDefault(); }, { passive: false });
  document.addEventListener('gestureend', function (event) { event.preventDefault(); }, { passive: false });
  document.addEventListener('touchstart', function (event) {
    if (event.touches && event.touches.length === 1) {
      __zentTouchX = event.touches[0].clientX;
      __zentTouchY = event.touches[0].clientY;
    }
  }, { passive: true });
  document.addEventListener('touchmove', function (event) {
    if (!event.touches) return;
    if (event.touches.length > 1) { event.preventDefault(); return; }
    if (__zentTouchX === null) return;
    var dx = Math.abs(event.touches[0].clientX - __zentTouchX);
    var dy = Math.abs(event.touches[0].clientY - __zentTouchY);
    if (dx > dy && dx > 6) event.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', function () {
    __zentTouchX = null;
    __zentTouchY = null;
  }, { passive: true });
</script>
<style>
  * { box-sizing: border-box; }
  :root {
    --forest: #163b32;
    --forest-2: #0b2b26;
    --sage: #8eb69b;
    --camel: #b08d6a;
    --cream: #f6f0e6;
    --ink: #1d2a25;
    --muted: #7b7568;
    --line: rgba(122, 110, 88, .2);
    --serif: "Redaction", Georgia, "Times New Roman", serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    overscroll-behavior-y: none;
  }
  html {
    background: linear-gradient(180deg, #0c2c26 0%, #0c2c26 50%, #f6f0e6 50%, #f6f0e6 100%);
  }
  body {
    min-height: 100dvh;
    font-family: var(--sans);
    background: var(--cream);
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: pan-y;
    overflow-x: hidden;
    overflow-x: clip;
    overscroll-behavior-x: none;
  }
  a { color: inherit; }
  .shell {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* En iPhone el documento no debe rebotar: si lo hace, Safari descubre
     el lienzo blanco por arriba y por abajo. El desplazamiento vive
     dentro de .shell, cuyo fondo es verde arriba y crema abajo, así que
     el rebote siempre enseña el color correcto. */
  @media (max-width: 899px) {
    html {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--cream);
    }
    body {
      position: fixed;
      inset: 0;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: var(--cream);
    }
    .shell {
      --top-h: 340px;
      height: 100%;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      background: linear-gradient(180deg, #0c2c26 0 var(--top-h), var(--cream) var(--top-h));
    }
  }

  /* ---------- Cabecera bosque ---------- */
  .bosque-top {
    position: relative;
    flex: none;
    min-height: 340px;
    overflow: hidden;
    padding-top: max(0px, env(safe-area-inset-top));
    color: #f5f0e6;
    background:
      radial-gradient(340px 260px at 18% 8%, rgba(142, 182, 155, .26), transparent 64%),
      radial-gradient(360px 300px at 96% 88%, rgba(176, 141, 106, .2), transparent 66%),
      linear-gradient(150deg, #214c40, #0c2c26 58%, #071d19);
    transition: min-height .25s ease;
  }
  .rosette {
    position: absolute;
    top: -46px;
    right: -70px;
    width: 340px;
    height: 340px;
    opacity: .28;
    pointer-events: none;
  }
  .rosette ellipse, .rosette circle {
    fill: none;
    stroke: #daf1de;
    stroke-width: 1;
  }
  .brand {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 11px;
    width: fit-content;
    margin: 18px 24px 0;
    text-decoration: none;
  }
  .seal {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border: 1.5px solid rgba(176, 141, 106, .9);
    border-radius: 50%;
    background: #f7f1e7;
    color: var(--forest);
    font-family: var(--serif);
    font-size: 27px;
    line-height: 1;
    box-shadow: 0 9px 20px rgba(3, 17, 14, .32), inset 0 0 0 3px rgba(142, 182, 155, .18);
  }
  .wordmark {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -.01em;
  }
  .bosque-copy {
    position: relative;
    z-index: 2;
    padding: 44px 26px 0;
    transition: opacity .2s ease, transform .25s ease;
  }
  .eyebrow {
    min-height: 1.2em;
    margin: 0 0 9px;
    color: #c3a17f;
    font-size: 9.5px;
    font-weight: 750;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .bosque-copy h1 {
    min-height: 2.04em;
    max-width: 310px;
    margin: 0;
    font-family: var(--serif);
    font-size: 36px;
    font-weight: 400;
    letter-spacing: -.028em;
    line-height: 1.02;
    white-space: pre-line;
  }
  .top-sub {
    min-height: 1.5em;
    margin: 9px 0 0;
    color: rgba(218, 241, 222, .72);
    font-size: 11.5px;
    line-height: 1.5;
  }
  .type-cursor {
    display: inline-block;
    width: 2px;
    height: .92em;
    margin-left: 2px;
    background: currentColor;
    vertical-align: -.08em;
    animation: cursor-blink .75s steps(1) infinite;
  }
  @keyframes cursor-blink {
    50% { opacity: 0; }
  }

  /* ---------- Hoja del formulario ---------- */
  .bosque-sheet {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 24px calc(24px + env(safe-area-inset-bottom));
    border-radius: 34px 34px 0 0;
    background:
      radial-gradient(420px 260px at 100% 0%, rgba(255, 255, 255, .62), transparent 60%),
      var(--cream);
    box-shadow: 0 -16px 34px rgba(5, 25, 20, .16);
  }
  .auth-tabs {
    position: relative;
    display: flex;
    gap: 4px;
    padding: 4px;
    overflow: hidden;
    border: 1px solid rgba(122, 110, 88, .16);
    border-radius: 999px;
    background: #e9dfd1;
  }
  .auth-tab-pill {
    position: absolute;
    z-index: 0;
    top: 4px;
    bottom: 4px;
    left: 4px;
    width: calc(50% - 6px);
    border-radius: 999px;
    background: #fffaf2;
    box-shadow: 0 4px 10px rgba(122, 102, 72, .12);
    pointer-events: none;
    transition: transform .32s cubic-bezier(.22, .9, .28, 1.12);
  }
  .auth-tabs[data-mode="signup"] .auth-tab-pill {
    transform: translateX(calc(100% + 4px));
  }
  .auth-tab {
    position: relative;
    z-index: 1;
    flex: 1;
    padding: 8px 0;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: #8a8274;
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: color .2s ease;
  }
  .auth-tab.active {
    color: var(--forest);
  }
  .auth-tab:focus-visible {
    outline: 2px solid var(--camel);
    outline-offset: -2px;
  }

  /* La recuperación es un flujo aparte: no mostramos las pestañas
     Entrar / Crear cuenta, pero conservamos el espacio para que el
     contenido no salte. */
  body.recovery-active .auth-tabs {
    display: none;
  }
  #recoveryRequest,
  #recoveryReset {
    padding-top: 40px;
  }
  .google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 100%;
    height: 46px;
    margin-top: 16px;
    border: 1px solid rgba(122, 110, 88, .18);
    border-radius: 14px;
    background: rgba(255, 255, 255, .62);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(122, 102, 72, .06);
    transition: background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .google:hover { background: rgba(255, 255, 255, .82); }
  .google:active { transform: scale(.985); }
  .google:disabled { opacity: .6; cursor: not-allowed; }
  .google svg { width: 17px; height: 17px; flex: none; }
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 15px 0;
    color: #8a8274;
    font-size: 10.5px;
    white-space: nowrap;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .field { display: flex; flex-direction: column; gap: 6px; margin-top: 11px; }
  .field label {
    color: var(--muted);
    font-size: 9.5px;
    font-weight: 750;
    letter-spacing: .11em;
    text-transform: uppercase;
  }
  .input-shell {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 46px;
    padding: 0 13px;
    border: 1px solid rgba(122, 110, 88, .16);
    border-radius: 14px;
    background: rgba(255, 255, 255, .68);
    color: var(--muted);
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .input-shell:focus-within {
    border-color: var(--camel);
    background: rgba(255, 255, 255, .86);
    box-shadow: 0 0 0 3px rgba(176, 141, 106, .14);
  }
  .input-shell > svg {
    flex: none;
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .input-shell input {
    flex: 1;
    min-width: 0;
    padding: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13.5px;
    -webkit-user-select: text;
    user-select: text;
  }
  .input-shell input::placeholder { color: #9a9385; }
  .eye {
    flex: none;
    display: grid;
    place-items: center;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #928b7d;
    cursor: pointer;
    transition: color .15s ease, background .15s ease;
  }
  .eye:hover { background: rgba(176, 141, 106, .12); color: var(--camel); }
  .eye.on { color: var(--camel); }
  .eye svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .primary {
    width: 100%;
    height: 48px;
    margin-top: 17px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(135deg, #235348, var(--forest-2));
    color: #f5f0e6;
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 14px 26px rgba(11, 43, 38, .28);
    transition: filter .15s ease, transform .12s ease;
  }
  .primary:hover { filter: brightness(1.07); }
  .primary:active { transform: scale(.985); }
  .primary:disabled { opacity: .6; cursor: not-allowed; }
  .link {
    display: block;
    width: 100%;
    padding: 10px 0 0;
    border: 0;
    background: none;
    color: var(--camel);
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
  }
  .link:hover { text-decoration: underline; }
  .hint {
    margin: 8px 0 0;
    color: #8d8676;
    font-size: 10.5px;
    line-height: 1.5;
    text-align: center;
  }
  .verify-icon {
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    margin: 2px auto 10px;
    border-radius: 50%;
    background: #e8efe7;
    color: var(--forest);
  }
  .verify-icon svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .verify-copy {
    margin: 0 0 14px;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.55;
    text-align: center;
  }
  .verify-copy strong {
    display: block;
    margin-top: 3px;
    color: var(--ink);
    font-weight: 650;
    word-break: break-all;
  }
  .code-input {
    display: block;
    width: 100%;
    height: 54px;
    padding: 0 8px;
    border: 1px solid rgba(122, 110, 88, .28);
    border-radius: 14px;
    background: #fffdf8;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 24px;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
    letter-spacing: .42em;
    text-indent: .42em;
    text-align: center;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .code-input::placeholder {
    color: #c9c1b3;
    opacity: .7;
  }
  .code-input:focus {
    border-color: var(--camel);
    box-shadow: 0 0 0 3px rgba(176, 141, 106, .14);
  }
  #changeEmail {
    color: #8d8676;
    font-size: 10.5px;
    font-weight: 600;
  }
  .error {
    display: none;
    margin-top: 14px;
    padding: 10px 12px;
    border: 1px solid rgba(166, 93, 74, .18);
    border-radius: 12px;
    background: rgba(166, 93, 74, .09);
    color: #a65d4a;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.45;
  }
  .error.ok {
    border-color: rgba(79, 127, 99, .18);
    background: rgba(79, 127, 99, .1);
    color: #4f7f63;
  }
  .secure {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: auto 0 0;
    padding-top: 12px;
    color: #979081;
    font-size: 10px;
    text-align: center;
  }
  .secure svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .login-version {
    color: rgba(123, 117, 104, .62);
    font-size: 9px;
    font-weight: 650;
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    z-index: 20;
    max-width: min(90vw, 420px);
    padding: 12px 18px;
    border-radius: 999px;
    background: var(--forest);
    color: #daf1de;
    font-size: 13px;
    font-weight: 650;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 8px);
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Pantallas cortas ---------- */
  @media (max-height: 700px) and (max-width: 899px) {
    .shell { --top-h: 280px; }
    .bosque-top { min-height: 280px; }
    .bosque-copy { padding-top: 30px; }
    .bosque-copy h1 { font-size: 31px; }
    .bosque-sheet { padding-top: 16px; }
  }

  @media (min-width: 600px) and (max-width: 899px) {
    .bosque-sheet { align-items: center; }
    .bosque-sheet > * { width: 100%; max-width: 460px; }
    .bosque-sheet .secure { margin-top: auto; }
  }

  /* Al escribir en el iPhone, la cabecera se compacta para que los
     campos queden por encima del teclado sin mover la hoja. */
  input { scroll-margin-bottom: 26px; }

  @media (max-width: 899px) {
    body.typing .shell { --top-h: env(safe-area-inset-top); }
    body.typing .bosque-top { min-height: env(safe-area-inset-top); }
    body.typing .brand { display: none; }
    body.typing .bosque-copy {
      position: absolute;
      inset: auto 0 0;
      visibility: hidden;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }
    /* Al escribir, el botón de Google y el separador se ocultan. La hoja
       baja solo lo justo: más espacio hace que iOS centre la contraseña
       y vuelva el rebote al cambiar de campo. */
    body.typing .bosque-sheet {
      padding-top: calc(20px + 16px);
    }
    body.typing .google,
    body.typing .divider {
      display: none;
    }
    /* Si el teclado se cerró pero el campo sigue enfocado (la barra de
       arriba/abajo del teclado sigue visible), bajamos la hoja para que
       el formulario no quede pegado al borde superior. */
    body.typing.keyboard-closed .bosque-sheet {
      padding-top: calc(20px + 14vh);
    }
  }

  /* Compactación instantánea al tocar un campo: iOS decide si debe
     desplazar la página justo al enfocar, así que la cabecera ya tiene
     que estar en su sitio final. */
  body.snap .bosque-top,
  body.snap .bosque-copy {
    transition: none !important;
  }

  /* Solo en pantallas bajas hace falta reservar recorrido para subir el
     campo por encima del teclado. En móviles altos la cabecera compacta
     ya deja los campos visibles y no debe quedar un hueco crema. */
  @media (max-width: 899px) {
    body.typing.short-screen .bosque-sheet {
      padding-bottom: calc(24px + env(safe-area-inset-bottom) + min(160px, var(--keyboard-height, 0px)));
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .auth-tab-pill,
    .auth-tab,
    .bosque-top,
    .bosque-copy {
      transition: none !important;
    }
    .type-cursor { animation: none; }
  }

  /* ---------- Escritorio ---------- */
  @media (min-width: 900px) {
    body {
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(900px 600px at 12% 0%, rgba(255, 252, 244, .85), transparent 62%),
        radial-gradient(900px 700px at 100% 100%, rgba(142, 182, 155, .24), transparent 62%),
        linear-gradient(168deg, #efe7da 0%, #e6dccd 48%, #ded2c1 100%);
    }
    .shell {
      width: min(1040px, 100%);
      min-height: 680px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border-radius: 36px;
      box-shadow: 0 40px 80px rgba(66, 50, 30, .22), 0 4px 14px rgba(66, 50, 30, .1);
    }
    .bosque-top {
      min-height: 100%;
      padding-top: 0;
      display: flex;
      flex-direction: column;
    }
    .brand { margin: 38px 42px 0; }
    .bosque-copy { margin-top: auto; margin-bottom: auto; padding: 0 44px; }
    .bosque-copy h1 { font-size: 48px; max-width: 370px; }
    .top-sub { font-size: 13px; }
    .rosette { top: -30px; right: -90px; width: 430px; height: 430px; }
    .bosque-sheet {
      justify-content: center;
      padding: 46px 46px calc(30px + env(safe-area-inset-bottom));
      border-radius: 0;
      box-shadow: none;
    }
    .bosque-sheet .secure { margin-top: 20px; }
    .toast { bottom: 24px; }
  }
</style>
</head>
<body>

  <defs>
    <symbol id="g-google" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>

<script>
(function () {
  'use strict';

  const btnLogin = document.getElementById('btnLogin');
  const btnSignup = document.getElementById('btnSignup');
  const tabLogin = document.getElementById('tabLogin');
  const tabSignup = document.getElementById('tabSignup');
  const authTabs = document.getElementById('authTabs');
  const modeLogin = document.getElementById('mode-login');
  const modeSignup = document.getElementById('mode-signup');
  const authEyebrow = document.getElementById('authEyebrow');
  const authTitle = document.getElementById('authTitle');
  const authSubtitle = document.getElementById('authSubtitle');
  const errorBox = document.getElementById('error');
  const toastEl = document.getElementById('toast');
  const resendLink = document.getElementById('resendLink');
  const btnGoogle = document.getElementById('btnGoogle');
  const signupForm = document.getElementById('signupForm');
  const signupVerify = document.getElementById('signupVerify');
  const verifyEmail = document.getElementById('verifyEmail');
  const verifyCode = document.getElementById('verifyCode');
  const btnVerify = document.getElementById('btnVerify');
  const resendCode = document.getElementById('resendCode');
  const changeEmail = document.getElementById('changeEmail');
  const loginForm = document.getElementById('loginForm');
  const forgotPassword = document.getElementById('forgotPassword');
  const recoveryRequest = document.getElementById('recoveryRequest');
  const recoveryReset = document.getElementById('recoveryReset');
  const recoveryEmail = document.getElementById('recoveryEmail');
  const recoveryEmailLabel = document.getElementById('recoveryEmailLabel');
  const recoveryCode = document.getElementById('recoveryCode');
  const recoveryPassword = document.getElementById('recoveryPassword');
  const recoveryConfirm = document.getElementById('recoveryConfirm');
  const btnSendRecovery = document.getElementById('btnSendRecovery');
  const btnResetPassword = document.getElementById('btnResetPassword');
  const resendRecovery = document.getElementById('resendRecovery');
  const backToLogin = document.getElementById('backToLogin');
  const backToLogin2 = document.getElementById('backToLogin2');
  let pendingEmail = '';
  let verifying = false;
  let recoveryEmailValue = '';
  let recoveryStep = '';

  function redirectTo() {
    return new URL('login.html', location.href).href;
  }

  function showResend(show) {
    resendLink.style.display = show ? 'block' : 'none';
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    setTimeout(() => toastEl.classList.remove('on'), 2600);
  }

  function showError(msg, ok) {
    errorBox.textContent = msg;
    errorBox.style.display = msg ? 'block' : 'none';
    errorBox.classList.toggle('ok', Boolean(ok));
  }

  const COPY = {
    login: {
      eyebrow: 'Bienvenido de nuevo',
      title: 'Tus finanzas,\ncon calma.',
      sub: 'Entra y sigue donde dejaste.'
    },
    signup: {
      eyebrow: 'Tu primer paso',
      title: 'Empieza con\ncalma.',
      sub: 'Crea tu cuenta y ordena tu dinero.'
    },
    verify: {
      eyebrow: 'Un último paso',
      title: 'Revisa tu\ncorreo.',
      sub: 'Escribe el código que te enviamos al correo.'
    },
    recovery: {
      eyebrow: 'Recupera tu cuenta',
      title: 'Vuelve a\ntu calma.',
      sub: 'Te enviaremos un código para cambiar tu contraseña.'
    },
    reset: {
      eyebrow: 'Casi listo',
      title: 'Elige una nueva\ncontraseña.',
      sub: 'Escribe el código y tu nueva contraseña.'
    }
  };

  let modeActual = 'login';
  let typeToken = 0;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function clearTypeCursors() {
    document.querySelectorAll('.type-cursor').forEach((cursor) => cursor.remove());
  }

  function typeInto(element, text, token, speed) {
    return new Promise((resolve) => {
      if (token !== typeToken) { resolve(); return; }
      element.textContent = '';
      const cursor = document.createElement('span');
      cursor.className = 'type-cursor';
      cursor.setAttribute('aria-hidden', 'true');
      element.appendChild(cursor);

      let index = 0;
      const step = () => {
        if (token !== typeToken) {
          cursor.remove();
          resolve();
          return;
        }
        if (index >= text.length) {
          cursor.remove();
          resolve();
          return;
        }
        const char = text.charAt(index);
        index += 1;
        cursor.insertAdjacentText('beforebegin', char);
        let delay = speed;
        if (char === '\n') delay += 90;
        else if (char === ' ' || char === ',' || char === '.') delay += 18;
        setTimeout(step, delay);
      };
      step();
    });
  }

  async function typeCopy(mode) {
    const token = typeToken + 1;
    typeToken = token;
    clearTypeCursors();
    const data = COPY[mode];

    if (reduceMotion) {
      authEyebrow.textContent = data.eyebrow;
      authTitle.textContent = data.title;
      authSubtitle.textContent = data.sub;
      return;
    }

    authEyebrow.textContent = '';
    authTitle.textContent = '';
    authSubtitle.textContent = '';

    await typeInto(authEyebrow, data.eyebrow, token, 12);
    if (token !== typeToken) return;
    await typeInto(authTitle, data.title, token, 15);
    if (token !== typeToken) return;
    await typeInto(authSubtitle, data.sub, token, 9);
  }

  function resetSignupForm() {
    pendingEmail = '';
    verifying = false;
    signupForm.style.display = 'block';
    signupVerify.style.display = 'none';
    verifyCode.value = '';
    btnVerify.disabled = true;
    btnVerify.textContent = btnVerify.dataset.label;
    showError('');
    showResend(false);
  }

  function enterVerify(email) {
    if (modeActual !== 'signup') setMode('signup');
    pendingEmail = email;
    verifying = true;
    signupForm.style.display = 'none';
    signupVerify.style.display = 'block';
    verifyEmail.textContent = email;
    verifyCode.value = '';
    btnVerify.disabled = true;
    btnVerify.textContent = btnVerify.dataset.label;
    const signupEmail = document.getElementById('signupEmail');
    if (signupEmail) signupEmail.value = email;
    showError('');
    showResend(false);
    typeCopy('verify');
    setTimeout(() => {
      try { verifyCode.focus({ preventScroll: true }); } catch (error) { /* ignorar */ }
    }, 180);
  }

  function resetRecovery() {
    recoveryEmailValue = '';
    recoveryStep = '';
    document.body.classList.remove('recovery-active');
    loginForm.style.display = 'block';
    recoveryRequest.style.display = 'none';
    recoveryReset.style.display = 'none';
    recoveryCode.value = '';
    recoveryPassword.value = '';
    recoveryConfirm.value = '';
    btnSendRecovery.disabled = false;
    btnSendRecovery.textContent = btnSendRecovery.dataset.label;
    btnResetPassword.disabled = true;
    btnResetPassword.textContent = btnResetPassword.dataset.label;
    showError('');
    showResend(false);
  }

  function showLoginForm() {
    resetRecovery();
    typeCopy('login');
    const email = document.getElementById('loginEmail');
    if (email) {
      try { email.focus({ preventScroll: true }); } catch (error) { /* ignorar */ }
    }
  }

  function showRecoveryRequest() {
    resetRecovery();
    recoveryStep = 'request';
    document.body.classList.add('recovery-active');
    loginForm.style.display = 'none';
    recoveryRequest.style.display = 'block';
    const email = document.getElementById('loginEmail').value.trim();
    if (email) recoveryEmail.value = email;
    typeCopy('recovery');
    setTimeout(() => {
      try { recoveryEmail.focus({ preventScroll: true }); } catch (error) { /* ignorar */ }
    }, 160);
  }

  function showRecoveryReset(email) {
    recoveryEmailValue = email;
    recoveryStep = 'reset';
    document.body.classList.add('recovery-active');
    loginForm.style.display = 'none';
    recoveryRequest.style.display = 'none';
    recoveryReset.style.display = 'block';
    recoveryEmailLabel.textContent = email;
    recoveryCode.value = '';
    recoveryPassword.value = '';
    recoveryConfirm.value = '';
    btnResetPassword.disabled = true;
    btnResetPassword.textContent = btnResetPassword.dataset.label;
    showError('');
    typeCopy('reset');
    setTimeout(() => {
      try { recoveryCode.focus({ preventScroll: true }); } catch (error) { /* ignorar */ }
    }, 180);
  }

  function updateResetButton() {
    const token = recoveryCode.value.replace(/\D/g, '');
    btnResetPassword.disabled = token.length < 6 || recoveryPassword.value.length < 6 || recoveryConfirm.value.length < 6;
  }

  function setMode(mode) {
    const next = mode === 'signup' ? 'signup' : 'login';
    if (next === modeActual) return;
    modeActual = next;
    const signup = next === 'signup';

    modeLogin.style.display = signup ? 'none' : 'block';
    modeSignup.style.display = signup ? 'block' : 'none';
    tabLogin.classList.toggle('active', !signup);
    tabSignup.classList.toggle('active', signup);
    tabLogin.setAttribute('aria-selected', signup ? 'false' : 'true');
    tabSignup.setAttribute('aria-selected', signup ? 'true' : 'false');
    authTabs.dataset.mode = signup ? 'signup' : 'login';

    resetSignupForm();
    resetRecovery();
    typeCopy(next);
  }

  tabLogin.addEventListener('click', () => {
    if (modeActual !== 'login') {
      setMode('login');
      return;
    }
    if (recoveryStep) showLoginForm();
  });
  tabSignup.addEventListener('click', () => {
    if (modeActual !== 'signup') {
      setMode('signup');
      return;
    }
    if (!verifying) return;
    resetSignupForm();
    typeCopy('signup');
  });

  /* En iPhone el teclado flota sobre la página: al enfocar un campo,
     se compacta la cabecera y se coloca el campo con el mínimo
     desplazamiento necesario para que quede por encima del teclado. */
  const vv = window.visualViewport;
  let baseViewportHeight = vv ? vv.height : Math.max(window.innerHeight, document.documentElement.clientHeight);
  let keyboardTimer = null;
  let keyboardCloseTimer = null;
  let focusSettleTimer = null;
  let keyboardWasOpen = false;
  // La reserva extra de scroll solo tiene sentido en pantallas bajas;
  // se decide con la altura real del dispositivo, no con la que deja el
  // teclado abierto.
  document.body.classList.toggle('short-screen', baseViewportHeight <= 700);

  function compactHeaderNow() {
    // Compacta la cabecera antes de que iOS decida si debe desplazar la
    // página al enfocar. Sin animación, para que el campo ya esté arriba.
    document.body.classList.add('typing', 'snap');
    void document.body.offsetHeight;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => document.body.classList.remove('snap'));
    });
  }

  function preScrollFocusedInput(input) {
    const shell = document.querySelector('.shell');
    if (!shell) return;
    const rect = input.getBoundingClientRect();
    const full = baseViewportHeight || Math.round(window.innerHeight) || 0;
    let keyboard = vv ? Math.max(0, baseViewportHeight - vv.height) : 0;
    if (keyboard < 90) keyboard = Math.min(380, Math.round(full * 0.44));
    const bottomLimit = full - keyboard - 16;
    if (rect.bottom <= bottomLimit) return;
    const target = shell.scrollTop + (rect.bottom - bottomLimit);
    const maxScroll = Math.max(0, shell.scrollHeight - shell.clientHeight);
    shell.scrollTop = Math.max(0, Math.min(target, maxScroll));
  }

  function resetDocumentScroll() {
    // iOS puede desplazar el documento al abrir el teclado aunque el
    // body esté fijo; si ocurre, lo devolvemos a cero.
    if (window.scrollY || document.documentElement.scrollTop) {
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
    }
  }

  function scrollFocusedInput() {
    resetDocumentScroll();
    const input = document.activeElement;
    if (!input || !input.matches || !input.matches('input')) return;
    const shell = document.querySelector('.shell');
    if (!shell) return;

    const rect = input.getBoundingClientRect();
    const viewTop = vv ? vv.offsetTop : 0;
    const viewBottom = vv ? vv.offsetTop + vv.height : (window.innerHeight || document.documentElement.clientHeight);
    const maxBottom = viewBottom - 20;
    // Posición del campo dentro del contenido desplazable.
    const contentTop = rect.top + shell.scrollTop;
    const contentBottom = rect.bottom + shell.scrollTop;

    // Si el campo ya se ve, no tocamos el scroll. Al pasar de correo a
    // contraseña el teclado ya está abierto y cualquier ajuste se nota
    // como un rebote.
    if (rect.top >= viewTop + 12 && rect.bottom <= maxBottom) return;

    let target = shell.scrollTop;
    if (contentBottom > maxBottom) target = contentBottom - maxBottom;
    else if (contentTop < viewTop + 12) target = contentTop - (viewTop + 12);

    const maxScroll = Math.max(0, shell.scrollHeight - shell.clientHeight);
    target = Math.max(0, Math.min(target, maxScroll));
    if (Math.abs(shell.scrollTop - target) < 2) return;
    shell.scrollTo({ top: target, behavior: 'auto' });
  }

  function updateKeyboardLayout() {
    if (!vv) return;
    const keyboard = Math.max(0, baseViewportHeight - vv.height);
    document.documentElement.style.setProperty('--keyboard-height', Math.round(keyboard) + 'px');
    const open = keyboard > 90;
    // Mientras haya un campo enfocado, la cabecera no debe expandirse
    // durante las alturas intermedias del teclado: eso causaba el rebote.
    const inputFocused = document.activeElement &&
      document.activeElement.matches && document.activeElement.matches('input');
    if (open) {
      clearTimeout(keyboardCloseTimer);
      clearTimeout(focusSettleTimer);
      keyboardCloseTimer = null;
      document.body.classList.remove('keyboard-closed');
    } else if (keyboardWasOpen) {
      // Esperamos a que el cierre sea real. Si el campo sigue enfocado,
      // añadimos keyboard-closed para bajar la hoja; si no, restauramos
      // el formulario normal.
      clearTimeout(keyboardCloseTimer);
      keyboardCloseTimer = setTimeout(() => {
        if (vv && vv.height < baseViewportHeight - 80) return;
        const active = document.activeElement;
        const stillFocused = active && active.matches && active.matches('input');
        if (stillFocused) {
          document.body.classList.add('keyboard-closed');
          return;
        }
        document.body.classList.remove('typing');
        document.body.classList.remove('keyboard-closed');
        const shell = document.querySelector('.shell');
        if (shell) shell.scrollTo({ top: 0, behavior: 'auto' });
        resetDocumentScroll();
      }, 600);
    }
    keyboardWasOpen = open;
    document.body.classList.toggle('typing', open || Boolean(inputFocused));
    if (open) {
      clearTimeout(keyboardTimer);
      keyboardTimer = setTimeout(scrollFocusedInput, 280);
    }
  }

  if (vv) {
    vv.addEventListener('resize', updateKeyboardLayout);
    vv.addEventListener('scroll', updateKeyboardLayout);
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        if (!document.body.classList.contains('typing')) {
          baseViewportHeight = vv.height;
          document.body.classList.toggle('short-screen', baseViewportHeight <= 700);
        }
      }, 350);
    });
  }

  const touchDevice = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0;
  if (touchDevice && window.matchMedia && window.matchMedia('(max-width: 899px)').matches) {
    document.querySelectorAll('input').forEach((input) => {
      // La cabecera se compacta cuando el campo ya tiene el foco, no al
      // tocarlo: si se mueve antes, iOS a veces pierde el toque y no abre
      // el teclado.
      input.addEventListener('focus', () => {
        document.body.classList.remove('keyboard-closed');
        if (!document.body.classList.contains('typing')) compactHeaderNow();
        preScrollFocusedInput(input);
        clearTimeout(keyboardTimer);
        keyboardTimer = setTimeout(scrollFocusedInput, 320);
        // Si el campo sigue enfocado y el teclado no llegó a abrirse,
        // bajamos la hoja para que el formulario no quede pegado arriba.
        clearTimeout(focusSettleTimer);
        focusSettleTimer = setTimeout(() => {
          const active = document.activeElement;
          if (!active || !active.matches || !active.matches('input')) return;
          const keyboardOpen = vv && vv.height < baseViewportHeight - 80;
          if (!keyboardOpen) document.body.classList.add('keyboard-closed');
        }, 900);
      });
      input.addEventListener('blur', () => {
        clearTimeout(focusSettleTimer);
        setTimeout(() => {
          const active = document.activeElement;
          if (active && active.matches && active.matches('input')) return;
          if (!vv || vv.height >= baseViewportHeight - 80) {
            document.body.classList.remove('typing');
            document.body.classList.remove('keyboard-closed');
            document.documentElement.style.setProperty('--keyboard-height', '0px');
            const shell = document.querySelector('.shell');
            if (shell) shell.scrollTo({ top: 0, behavior: 'auto' });
            resetDocumentScroll();
          }
        }, 300);
      });
    });
  }

  function togglePasswordVisibility(button) {
    const input = document.getElementById(button.dataset.eye);
    if (!input) return;

    // Guardamos el foco y la posición del cursor para devolverlos después
    // de cambiar el tipo del campo.
    const wasFocused = document.activeElement === input;
    const start = input.selectionStart;
    const end = input.selectionEnd;
    const visible = input.type === 'password';

    input.type = visible ? 'text' : 'password';
    button.classList.toggle('on', visible);
    button.setAttribute('aria-label', visible ? 'Ocultar contraseña' : 'Mostrar contraseña');
    const use = button.querySelector('use');
    if (use) {
      const icon = visible ? '#g-eye-off' : '#g-eye';
      use.setAttribute('href', icon);
      use.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', icon);
    }

    if (wasFocused) {
      try {
        input.focus({ preventScroll: true });
        if (start !== null && end !== null && input.setSelectionRange) {
          input.setSelectionRange(start, end);
        }
      } catch (error) { /* ignorar */ }
    }
  }

  document.querySelectorAll('[data-eye]').forEach((button) => {
    // En iOS, tocar un botón dentro del campo hace que el campo pierda el
    // foco y el teclado se cierre. Al evitar el comportamiento por
    // defecto del pointerdown/mousedown, el foco se queda en la contraseña.
    const keepFocus = (event) => { event.preventDefault(); };
    button.addEventListener('pointerdown', (event) => {
      keepFocus(event);
      button.dataset.eyeHandled = '1';
      togglePasswordVisibility(button);
      setTimeout(() => { delete button.dataset.eyeHandled; }, 500);
    });
    button.addEventListener('mousedown', keepFocus);
    button.addEventListener('click', (event) => {
      if (button.dataset.eyeHandled) {
        event.preventDefault();
        return;
      }
      togglePasswordVisibility(button);
    });
  });

  // La página de acceso también registra el service worker: así queda
  // disponible sin conexión y las próximas aperturas son instantáneas.
  if ('serviceWorker' in navigator) {
    // Si entra una versión nueva del service worker, recargamos una sola
    // vez para que el login use el HTML nuevo y no se quede con el viejo.
    // En la primera visita no hace falta: la página ya viene de la red.
    const hadController = !!navigator.serviceWorker.controller;
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || refreshing) return;
      refreshing = true;
      window.location.reload();
    });
    const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (location.protocol === 'https:' || isLocal) {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .then((registration) => registration.update().catch(() => {}))
        .catch((error) => console.warn('Zent: no se pudo registrar el service worker.', error));
    }
  }

  function setLoading(el, loading) {
    el.disabled = loading;
    el.textContent = loading ? 'Procesando…' : el.dataset.label;
  }

  function translateError(err) {
    const msg = (err && err.message ? err.message : String(err || '')).toLowerCase();

    if (msg.includes('invalid login credentials')) return 'Correo o contraseña incorrectos.';
    if (msg.includes('email not confirmed')) return 'Debes confirmar tu correo antes de iniciar sesión. Revisa tu bandeja de entrada (y spam).';
    if (msg.includes('token has expired') || msg.includes('invalid token') || msg.includes('invalid otp') || msg.includes('otp_expired')) return 'El código no es válido o ya expiró. Pide uno nuevo.';
    if (msg.includes('user already registered')) return 'Ya existe una cuenta con ese correo. Inicia sesión.';
    if (msg.includes('password should be at least')) return 'La contraseña debe tener al menos 6 caracteres.';
    if (msg.includes('new password should be different') || msg.includes('same as the old')) return 'La nueva contraseña debe ser diferente a la anterior.';
    if (msg.includes('user not found')) return 'No encontramos una cuenta con ese correo.';
    if (msg.includes('email link is invalid')) return 'El código no es válido o ya expiró. Pide uno nuevo.';
    if (msg.includes('unable to validate email') || msg.includes('invalid email')) return 'El correo no es válido.';
    if (msg.includes('security purposes') || msg.includes('only request this after')) return 'Espera unos segundos antes de pedir otro código.';
    if (msg.includes('rate limit') || msg.includes('too many requests')) return 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.';
    if (msg.includes('signups not allowed')) return 'El registro está deshabilitado en Supabase.';
    if (msg.includes('provider is not enabled') || msg.includes('unsupported provider')) return 'El inicio de sesión con Google no está habilitado en Supabase.';
    if (msg.includes('access_denied') || msg.includes('canceled') || msg.includes('cancelled')) return 'Cancelaste el inicio de sesión con Google.';
    if (msg.includes('failed to fetch') || msg.includes('networkerror')) return 'No hay conexión con el servidor. Revisa tu internet e inténtalo de nuevo.';
    if (msg.includes('email address') && msg.includes('invalid')) return 'El correo no es válido.';
    return (err && err.message) ? err.message : 'Ocurrió un error inesperado.';
  }

  function client() {
    if (typeof supabaseClient === 'undefined' || !supabaseClient) {
      showError('No se pudo conectar con Supabase. Revisa tu conexión y recarga la página.');
      return null;
    }
    return supabaseClient;
  }

  btnGoogle.addEventListener('click', async () => {
    const sb = client();
    if (!sb) return;

    showError('');
    showResend(false);
    btnGoogle.disabled = true;
    try {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: redirectTo() }
      });
      if (error) {
        showError(translateError(error));
        btnGoogle.disabled = false;
      }
    } catch (err) {
      showError(translateError(err));
      btnGoogle.disabled = false;
    }
  });

  async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { showError('Completa correo y contraseña.'); return; }

    const sb = client();
    if (!sb) return;

    showError('');
    showResend(false);
    setLoading(btnLogin, true);
    try {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        const message = translateError(error);
        if (/confirmar tu correo/i.test(message)) {
          enterVerify(email);
          return;
        }
        showError(message);
        return;
      }
      showToast('Sesión iniciada.');
      setTimeout(() => { location.href = 'index.html'; }, 500);
    } catch (err) {
      showError(translateError(err));
    } finally {
      setLoading(btnLogin, false);
    }
  }

  async function handleSignup() {
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    if (!email || !password) { showError('Completa correo y contraseña.'); return; }
    if (password.length < 6) { showError('La contraseña debe tener al menos 6 caracteres.'); return; }

    const sb = client();
    if (!sb) return;

    showError('');
    setLoading(btnSignup, true);
    try {
      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: { emailRedirectTo: redirectTo() }
      });
      if (error) { showError(translateError(error)); return; }

      if (data && data.session) {
        showToast('Cuenta creada. Entrando…');
        setTimeout(() => { location.href = 'index.html'; }, 700);
        return;
      }

      if (!data || !data.user) {
        showError('No se pudo crear la cuenta. Inténtalo de nuevo.');
        return;
      }

      // Supabase devuelve un usuario "falso" sin identidades cuando el
      // correo ya está registrado, para no revelar qué cuentas existen.
      if (Array.isArray(data.user.identities) && data.user.identities.length === 0) {
        showError('Ya existe una cuenta con ese correo. Inicia sesión.');
        return;
      }

      document.getElementById('signupPassword').value = '';
      enterVerify(email);
    } catch (err) {
      showError(translateError(err));
    } finally {
      setLoading(btnSignup, false);
    }
  }

  async function handleVerify() {
    const token = verifyCode.value.replace(/\D/g, '').slice(0, 8);
    if (token.length < 6) {
      showError('Escribe el código completo que te llegó al correo.');
      verifyCode.focus();
      return;
    }
    if (!pendingEmail) {
      showError('Vuelve a crear la cuenta o inicia sesión.');
      return;
    }
    const sb = client();
    if (!sb) return;

    showError('');
    setLoading(btnVerify, true);
    try {
      const { data, error } = await sb.auth.verifyOtp({
        email: pendingEmail,
        token,
        type: 'signup'
      });
      if (error) {
        showError(translateError(error));
        return;
      }
      if (data && data.session) {
        showToast('Cuenta confirmada. Entrando…');
        setTimeout(() => { location.href = 'index.html'; }, 650);
        return;
      }
      showError('No se pudo confirmar la cuenta. Pide un código nuevo.');
    } catch (err) {
      showError(translateError(err));
    } finally {
      setLoading(btnVerify, false);
      btnVerify.disabled = verifyCode.value.replace(/\D/g, '').length < 6;
    }
  }

  async function handleSendRecovery() {
    const email = recoveryEmail.value.trim();
    if (!email) {
      showError('Escribe tu correo.');
      recoveryEmail.focus();
      return;
    }
    const sb = client();
    if (!sb) return;

    showError('');
    setLoading(btnSendRecovery, true);
    try {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectTo() });
      if (error) { showError(translateError(error)); return; }
      showRecoveryReset(email);
      showToast('Código enviado. Revisa tu correo.');
    } catch (err) {
      showError(translateError(err));
    } finally {
      setLoading(btnSendRecovery, false);
    }
  }

  async function handleResetPassword() {
    const token = recoveryCode.value.replace(/\D/g, '').slice(0, 8);
    const password = recoveryPassword.value;
    const confirm = recoveryConfirm.value;

    if (token.length < 6) {
      showError('Escribe el código completo que te llegó al correo.');
      recoveryCode.focus();
      return;
    }
    if (password.length < 6) {
      showError('La contraseña debe tener al menos 6 caracteres.');
      recoveryPassword.focus();
      return;
    }
    if (password !== confirm) {
      showError('Las contraseñas no coinciden.');
      recoveryConfirm.focus();
      return;
    }
    if (!recoveryEmailValue) {
      showError('Vuelve a solicitar el código.');
      return;
    }

    const sb = client();
    if (!sb) return;

    showError('');
    setLoading(btnResetPassword, true);
    try {
      const { error: verifyError } = await sb.auth.verifyOtp({
        email: recoveryEmailValue,
        token,
        type: 'recovery'
      });
      if (verifyError) { showError(translateError(verifyError)); return; }

      const { error: updateError } = await sb.auth.updateUser({ password });
      if (updateError) { showError(translateError(updateError)); return; }

      showToast('Contraseña actualizada. Entrando…');
      setTimeout(() => { location.href = 'index.html'; }, 700);
    } catch (err) {
      showError(translateError(err));
    } finally {
      setLoading(btnResetPassword, false);
      updateResetButton();
    }
  }

  async function handleResendRecovery() {
    if (!recoveryEmailValue) {
      showRecoveryRequest();
      return;
    }
    const sb = client();
    if (!sb) return;

    showError('');
    resendRecovery.disabled = true;
    resendRecovery.textContent = 'Enviando…';
    try {
      const { error } = await sb.auth.resetPasswordForEmail(recoveryEmailValue, { redirectTo: redirectTo() });
      if (error) { showError(translateError(error)); return; }
      showToast('Código reenviado. Revisa tu correo.');
      recoveryCode.value = '';
      updateResetButton();
      recoveryCode.focus();
    } catch (err) {
      showError(translateError(err));
    } finally {
      resendRecovery.disabled = false;
      resendRecovery.textContent = 'Reenviar código';
    }
  }

  recoveryCode.addEventListener('input', () => {
    const digits = recoveryCode.value.replace(/\D/g, '').slice(0, 8);
    if (recoveryCode.value !== digits) recoveryCode.value = digits;
    updateResetButton();
  });
  recoveryCode.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      recoveryPassword.focus();
    }
  });
  recoveryPassword.addEventListener('input', updateResetButton);
  recoveryConfirm.addEventListener('input', updateResetButton);
  recoveryEmail.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSendRecovery();
  });
  recoveryConfirm.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleResetPassword();
  });

  verifyCode.addEventListener('input', () => {
    const digits = verifyCode.value.replace(/\D/g, '').slice(0, 8);
    if (verifyCode.value !== digits) verifyCode.value = digits;
    btnVerify.disabled = digits.length < 6;
  });
  verifyCode.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleVerify();
  });

  resendCode.addEventListener('click', async () => {
    if (!pendingEmail) {
      showError('Vuelve a crear la cuenta o inicia sesión.');
      return;
    }
    const sb = client();
    if (!sb) return;

    showError('');
    resendCode.disabled = true;
    resendCode.textContent = 'Enviando…';
    try {
      const { error } = await sb.auth.resend({
        type: 'signup',
        email: pendingEmail,
        options: { emailRedirectTo: redirectTo() }
      });
      if (error) { showError(translateError(error)); return; }
      showToast('Código reenviado. Revisa tu correo.');
      verifyCode.value = '';
      btnVerify.disabled = true;
      verifyCode.focus();
    } catch (err) {
      showError(translateError(err));
    } finally {
      resendCode.disabled = false;
      resendCode.textContent = 'Reenviar código';
    }
  });

  changeEmail.addEventListener('click', () => {
    resetSignupForm();
    typeCopy('signup');
    const input = document.getElementById('signupEmail');
    if (input) {
      input.focus();
      input.select();
    }
  });

  btnLogin.addEventListener('click', handleLogin);
  btnSignup.addEventListener('click', handleSignup);
  btnVerify.addEventListener('click', handleVerify);
  forgotPassword.addEventListener('click', showRecoveryRequest);
  btnSendRecovery.addEventListener('click', handleSendRecovery);
  btnResetPassword.addEventListener('click', handleResetPassword);
  resendRecovery.addEventListener('click', handleResendRecovery);
  backToLogin.addEventListener('click', showLoginForm);
  backToLogin2.addEventListener('click', showLoginForm);

  document.getElementById('loginPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleLogin();
  });
  document.getElementById('signupPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSignup();
  });

  resendLink.addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    if (!email) {
      showError('Escribe tu correo en el campo de arriba para reenviar la confirmación.');
      return;
    }
    const sb = client();
    if (!sb) return;

    showError('');
    resendLink.disabled = true;
    try {
      const { error } = await sb.auth.resend({
        type: 'signup',
        email,
        options: { emailRedirectTo: redirectTo() }
      });
      if (error) { showError(translateError(error)); return; }
      showToast('Correo reenviado. Revisa tu bandeja y spam.');
    } catch (err) {
      showError(translateError(err));
    } finally {
      resendLink.disabled = false;
    }
  });

  // Mensaje si se acaba de eliminar la cuenta desde Ajustes.
  try {
    if (sessionStorage.getItem('zent.accountDeleted') === '1') {
      sessionStorage.removeItem('zent.accountDeleted');
      showError('Tu cuenta se eliminó correctamente.', true);
    }
  } catch (error) { /* sin acceso a sessionStorage */ }

  // Escribe la cabecera inicial y vuelve a escribirla al cambiar de modo.
  typeCopy('login');

  // Si ya hay una sesión activa, ir directo a la app.
  (async () => {
    // Errores que Supabase devuelve al volver del enlace de confirmación.
    if (location.hash) {
      const params = new URLSearchParams(location.hash.replace(/^#/, ''));
      const message = params.get('error_description') || params.get('error');
      if (message) {
        showError(decodeURIComponent(message.replace(/\+/g, ' ')));
        history.replaceState(null, '', location.pathname + location.search);
      }
    }

    if (typeof supabaseClient === 'undefined' || !supabaseClient) {
      showError('No se pudo cargar Supabase. Revisa tu conexión, desactiva bloqueadores y recarga la página.');
      return;
    }
    try {
      const { data } = await supabaseClient.auth.getSession();
      if (data && data.session) location.replace('index.html');
    } catch (err) {
      console.warn('Zent: no se pudo comprobar la sesión.', err);
    }
  })();
})();
</script>
</body>
</html>
