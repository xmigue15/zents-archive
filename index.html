<head>

<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="icons/zent.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script>
  var __zentTouchX = null;
  var __zentTouchY = null;
  document.addEventListener('gesturestart', function (event) { event.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function (event) { event.preventDefault(); }, { passive: false });
  document.addEventListener('gestureend', function (event) { event.preventDefault(); }, { passive: false });
  document.addEventListener('touchstart', function (event) {
    if (event.touches && event.touches.length === 1) {
      __zentTouchX = event.touches[0].clientX;
      __zentTouchY = event.touches[0].clientY;
    }
  }, { passive: true });
  document.addEventListener('touchmove', function (event) {
    if (!event.touches) return;
    if (event.touches.length > 1) { event.preventDefault(); return; }
    if (__zentTouchX === null) return;
    var dx = Math.abs(event.touches[0].clientX - __zentTouchX);
    var dy = Math.abs(event.touches[0].clientY - __zentTouchY);
    if (dx > dy && dx > 6) event.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', function () {
    __zentTouchX = null;
    __zentTouchY = null;
  }, { passive: true });
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Navegación principal">

  <div class="main">
    <header class="topbar">

      </button>

      </button>

<div id="modalRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="sync.js"></script>
<script>
(async () => {
  if (typeof supabaseClient === 'undefined' || !supabaseClient) {
    location.href = 'login.html';
    return;
  }
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    location.href = 'login.html';
  }
})();
</script>
<script src="app.js" defer></script>
</body>
</html>
